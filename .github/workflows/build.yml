name: Build Windows installer

# Сборка запускается при каждом push/pull request и вручную (Actions -> Run workflow).
# При push тега вида v1.2.3 дополнительно создаётся GitHub Release с установщиком —
# именно оттуда программа берёт обновления.

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Set version
        id: ver
        run: python tools/set_version.py --ref "${{ github.ref }}" --repo "${{ github.repository }}" --run "${{ github.run_number }}"

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests

      - name: Build executables (PyInstaller)
        run: python -m PyInstaller packaging/vcmx2stp.spec --noconfirm --clean

      - name: Smoke test of the frozen program
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python tests/make_sample.py build/sample.vcmx
          & dist/VCMX2STP/vcmx2stp-cli.exe build/sample.vcmx -o build/sample.stp
          if ($LASTEXITCODE -ne 0) { throw "vcmx2stp-cli.exe завершился с кодом $LASTEXITCODE" }
          if (-not (Test-Path build/sample.stp)) { throw "STEP не создан" }
          $txt = Get-Content build/sample.stp -Raw
          if ($txt -match "TRIANGULATED|TESSELLATED") { throw "в STEP есть тесселированные (треугольные) сущности" }
          if ($txt -notmatch "NEXT_ASSEMBLY_USAGE_OCCURRENCE") { throw "в STEP нет структуры сборок" }
          Write-Host ("STEP OK, размер {0:N0} байт" -f (Get-Item build/sample.stp).Length)

      - name: Install Inno Setup (if missing)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer (Inno Setup)
        run: |
          & "$env:ISCC" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppRepo=${{ github.repository }}" "/DSourceDir=..\dist\VCMX2STP" installer\vcmx2stp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }

      - name: Portable ZIP
        run: Compress-Archive -Path dist/VCMX2STP/* -DestinationPath "dist/installer/VCMX2STP-portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VCMX2STP-${{ steps.ver.outputs.version }}
          path: dist/installer/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VCMX2STP ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/installer/VCMX2STP-Setup-${{ steps.ver.outputs.version }}.exe
            dist/installer/VCMX2STP-portable-${{ steps.ver.outputs.version }}.zip
